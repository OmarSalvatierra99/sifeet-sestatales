<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIFEET Estatales · Acceso</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/ofs_logo.png') }}">
</head>
<body class="login-page">
  <header class="site-header">
    <div class="header-inner">
      <img src="{{ url_for('static', filename='img/ofs_logo.png') }}" alt="Logo institucional" class="ofs-logo">
      <div class="header-text">
        <p class="eyebrow">Órgano de Fiscalización Superior del Estado de Tlaxcala</p>
        <h1>SIFEET Estatales</h1>
        <p class="subtitle">Acceso al sistema</p>
      </div>
    </div>
  </header>

  <main class="page-content login-content">
    <section class="panel form-panel login-panel">
      <div class="panel-header">
        <h2>Inicio de sesión</h2>
        <p>Acceso seguro para consulta y captura institucional.</p>
      </div>

      {% if error %}
        <div class="status status-error">{{ error }}</div>
      {% endif %}

      <div class="login-grid">
        <form class="record-form login-form" method="POST" autocomplete="off">
          <input type="hidden" name="next" value="{{ next_url }}">
          <div class="form-grid">
          <div class="field">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" placeholder="Ej. luis o gabo" required />
          </div>
            <div class="field">
              <label for="password">Contraseña</label>
              <input id="password" name="password" type="password" required />
            </div>
          </div>
          <button class="btn-primary" type="submit">Entrar</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    © Órgano de Fiscalización Superior del Estado de Tlaxcala · SIFEET Estatales
  </footer>
</body>
</html>
